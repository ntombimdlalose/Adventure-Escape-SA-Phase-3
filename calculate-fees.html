
<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">

    <!-- Header -->

            <img src="logo.png.png" alt="Adventure Escape SA Logo">

        <div class="header-content">
            <h1>Adventure Escape SA</h1>

    <!-- Calculate Fees -->
    <main>

        <section class="fees">
            <h2>Calculate Fees</h2>

            <p>Choose an adventure activity and enter the number of people.</p>

            <label for="activity">Choose an Activity:</label>
            <select id="activity">
                <option>Hiking</option>
                <option>Kayaking</option>
                <option>Ziplining</option>
            </select>

            <label for="people">Number of People:</label>
            <input type="number" id="people" min="1">

            <button type="button">Calculate Fee</button>

        </section>

    </main>
